; Voltra Ring Nano - BLE remote for the Beyond Power Voltra I
; Target: Seeed XIAO ESP32-C6 with a 0.49" 64x32 I2C OLED, a scroll wheel encoder on
; D2 / D3 and a load button on D1

[platformio]
default_envs = remote

; Flags shared by the release and diagnostic builds.
[common]
build_flags =
    -std=gnu++17
    -Wall
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -Isrc
    ; Scroll wheel: 1 flips the direction
    -DKNOB_INVERT=0
    ; Screen: 1 turns the picture round 180 degrees
    -DOLED_ROTATE_180=0
    ; NimBLE: drop the server/advertising wrapper code, we are central only.
    ; Do not override CONFIG_BT_NIMBLE_MAX_CONNECTIONS here: the Arduino core ships a
    ; precompiled NimBLE host with it fixed, and redefining it only desyncs the wrapper
    ; from the library.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

[env:remote]
; pioarduino = Arduino core 3.x on ESP-IDF 5.x (pulse counter and LP IO wake APIs)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

board_build.f_cpu = 160000000L
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

lib_deps =
    h2zero/NimBLE-Arduino@^2.2.0

build_unflags = -std=gnu++11
build_flags =
    ${common.build_flags}
    ; Release: no log output over serial (Arduino log_* and NimBLE are silent)
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

; Diagnostic build, for protocol work only: full serial logging, every parameter read and
; write, workout telemetry, and a periodic sweep of the registers listed in
; src/voltra/sweep_params.cpp so snapshots can be diffed.
;   pio run -e remote_diag -t upload
[env:remote_diag]
extends = env:remote
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1
    -DVOLTRA_DIAG=1

; Host-side unit tests for the protocol layer:  pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<voltra/voltra_protocol.cpp>
build_flags =
    -std=gnu++17
    -Isrc
